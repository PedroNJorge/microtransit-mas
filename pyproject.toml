[project]
name = "microtransit-mas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "branca>=0.8.2",
    "folium>=0.20.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "osmnx>=2.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "spade>=4.1.4",
    "sqlalchemy[asyncio]>=2.1.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]        # pytest ≥ 7 has this built-in, no plugin needed
testpaths = ["tests"]  # optional: where to look for tests
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a local XMPP server (started automatically); deselect with -m 'not integration'",
]
